<svg width="512" height="512" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>LBF26 Planner Icon</title>
  <desc>Square icon with cosmic space background, LBF26 above star and PLANNER curving below</desc>

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="35%" stop-color="#CC4400"/>
      <stop offset="65%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#1A0040"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFF9C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFE066" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="400" height="400" rx="40"/>
    </clipPath>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="starFilter">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <path id="arcTop" d="M 60,225 A 155,155 0 0,1 340,225"/>
    <path id="arcBottom" d="M 75,262 A 155,155 0 0,0 325,262"/>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect x="0" y="0" width="400" height="400" fill="url(#bgGrad)"/>

    <circle cx="60" cy="50" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="330" cy="40" r="1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="360" cy="80" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="50" cy="120" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="380" cy="150" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="310" cy="70" r="1" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="80" cy="90" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="55" cy="65" r="5" fill="#E65100" opacity="0.7"/>
    <circle cx="340" cy="55" r="7" fill="#BF360C" opacity="0.6"/>

    <ellipse cx="200" cy="340" rx="90" ry="90" fill="url(#sunGrad)" filter="url(#softBlur)" opacity="0.9"/>
    <ellipse cx="200" cy="340" rx="60" ry="60" fill="#FFE066" opacity="0.7"/>

    <rect x="0" y="360" width="400" height="40" fill="#0D001A" opacity="0.85"/>
    <rect x="0" y="350" width="400" height="20" fill="#1A0040" opacity="0.7"/>

    <circle cx="200" cy="210" r="55" fill="url(#starGlow)" filter="url(#starFilter)"/>

    <ellipse cx="200" cy="210" rx="95" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="297 1" stroke-dashoffset="-148"/>

    <polygon points="200,145 203,203 200,210 197,203" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="200,270 203,217 200,210 197,217" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="135,210 188,207 195,210 188,213" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="265,210 212,207 205,210 212,213" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="155,165 196,205 195,210 192,206" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="245,165 204,205 205,210 208,206" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="155,255 196,215 195,210 192,214" fill="#FFFFFF" opacity="0.5"/>
    <polygon points="245,255 204,215 205,210 208,214" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="200" cy="210" r="12" fill="#FFFFFF"/>
    <circle cx="200" cy="210" r="7" fill="#FFF9C4"/>

    <ellipse cx="200" cy="210" rx="95" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="148 149" stroke-dashoffset="0"/>

    <text font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="58" letter-spacing="6" fill="#FFFFFF">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">LBF26</textPath>
    </text>

    <text font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="28" letter-spacing="8" fill="#FFFFFF" opacity="0.95">
      <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">PLANNER</textPath>
    </text>

    <rect x="0" y="0" width="400" height="400" rx="40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08"/>
  </g>
</svg>
